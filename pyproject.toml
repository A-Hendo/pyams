[project]
name = "pyams"
version = "0.1.0"
description = "Python, Yet Another Media Server CLI for windows and linux"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "requests>=2.33.1",
    "rich>=14.3.3",
    "ruff>=0.15.9",
    "typer>=0.24.1",
]

[project.scripts]
pyams = "pyams.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyams"]

[tool.hatch.build.targets.sdist]
include = ["src/pyams"]

[tool.hatch.build.targets.app]
# Creates standalone executables (exe for Windows, binary for Linux)
compression = true
